[project]
name = "haido"
version = "0.1.0"
description = "Hải Đồ IT — miền nghiệp vụ và API đọc"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
# Gốc repo còn kiểm thử của scraper/ và .claude/skills/ chạy bằng môi trường khác.
# Job Python của CI chạy `uv run pytest` từ gốc repo, nên chỉ thu thập tests/.
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "determinism: chạy hai lần liên tiếp trong CI, kết quả phải giống hệt (AD-24)",
]

[tool.ruff]
target-version = "py313"
# tools/ có lỗi ruff có sẵn mà #2 không được sửa (check_gates.py); các thư mục còn lại
# không thuộc haido_* và có job hoặc môi trường riêng.
extend-exclude = ["scraper", ".claude", "_bmad", "_bmad-output", "tools"]
