name: Deploy

# Build image trên Actions rồi đẩy lên GHCR; VPS chỉ pull và chạy.
# Giữ đúng AD-15: `next build` không bao giờ chạy trên máy chủ prod.
#
# Workflow chỉ chạy khi biến repo DEPLOY_ENABLED = true
# (Settings > Secrets and variables > Actions > Variables).
# Trước khi có VPS thì để false, workflow bỏ qua chứ không đỏ.
#
# Cần các secret: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_PATH
# Token kéo image: GHCR_PULL_TOKEN nếu có, không thì GITHUB_TOKEN của job.
# Tùy chọn:       HEALTHCHECK_URL (cổng bắt buộc là localhost trên VPS)

on:
  push:
    branches: [main]
    paths:
      - "haido_core/**"
      - "haido_api/**"
      - "haido_pipeline/**"
      - "web/**"
      - "deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA để quay về (bỏ trống = commit hiện tại)"
        required: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image (${{ matrix.app }})
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: deploy/api.Dockerfile
          - app: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull and run on VPS
    if: vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Load SSH key and known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy compose file
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          scp deploy/compose.prod.yml "$USER@$HOST:$VPS_PATH/compose.prod.yml"

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" bash -se <<EOF
            set -euo pipefail
            cd "$VPS_PATH"
            line=\$(grep -m1 '^HAIDO_DATABASE_URL=' .env || true)
            haido_url=\${line#*=}
            haido_url=\${haido_url%\$'\\r'}
            case "\$haido_url" in
              \"*\") haido_url=\${haido_url#\\\"}; haido_url=\${haido_url%\\\"} ;;
              \'*\') haido_url=\${haido_url#\\\'}; haido_url=\${haido_url%\\\'} ;;
            esac
            if [ -z "\$haido_url" ]; then
              line=\$(grep -m1 '^DATABASE_URL=' .env || true)
              base=\${line#*=}
              base=\${base%\$'\\r'}
              case "\$base" in
                \"*\") base=\${base#\\\"}; base=\${base%\\\"} ;;
                \'*\') base=\${base#\\\'}; base=\${base%\\\'} ;;
              esac
              case "\$base" in
                postgresql+psycopg://*) haido_url=\$base ;;
                postgresql://*) haido_url="postgresql+psycopg://\${base#postgresql://}" ;;
                postgres://*) haido_url="postgresql+psycopg://\${base#postgres://}" ;;
                *) echo "Không suy ra được URL kho"; exit 1 ;;
              esac
            fi
            export HAIDO_DATABASE_URL="\$haido_url"
            unset line haido_url base
            token="${GHCR_PULL_TOKEN:-$GITHUB_TOKEN}"
            if [ -z "\$token" ]; then
              echo "Thiếu token kéo image"
              exit 1
            fi
            printf '%s\n' "\$token" | docker login ghcr.io -u "$ACTOR" --password-stdin
            unset token
            export IMAGE_TAG="sha-$SHA"
            docker compose -f compose.prod.yml pull
            docker logout ghcr.io
            docker compose -f compose.prod.yml run --rm --no-deps -T -e HAIDO_ALLOW_REMOTE_MIGRATION=1 api alembic upgrade head < /dev/null
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker compose -f compose.prod.yml ps
            # 35 GB đĩa: không dọn thì image cũ ăn hết trong vài tuần
            docker image prune -f --filter "until=168h"
            ok=0
            for i in \$(seq 1 20); do
              if curl -fsS --max-time 10 http://127.0.0.1:8000/openapi.json >/dev/null \
                && curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000; then
                echo "sống sau \$i lần thử"
                ok=1
                break
              fi
              sleep 6
            done
            [ "\$ok" -eq 1 ] || { echo "không phản hồi sau 2 phút"; exit 1; }
          EOF

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "chưa đặt HEALTHCHECK_URL — bỏ qua"; exit 0
          fi
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$HEALTHCHECK_URL" > /dev/null; then
              echo "sống sau $i lần thử"; exit 0
            fi
            sleep 6
          done
          echo "không phản hồi sau 2 phút"; exit 1

      - name: Report rollback instructions on failure
        if: failure()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          echo "::warning::Deploy hỏng. Quay về bằng: chạy lại workflow này với input sha = commit trước đó."
          ssh -o BatchMode=yes "$USER@$HOST" "cd '$VPS_PATH' && docker compose -f compose.prod.yml ps" || true

      - name: Remove SSH key
        if: always()
        run: rm -rf ~/.ssh
