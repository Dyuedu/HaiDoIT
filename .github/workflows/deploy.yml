name: Deploy

# Build image trên Actions rồi đẩy lên GHCR; VPS chỉ pull và chạy.
# Giữ đúng AD-15: `next build` không bao giờ chạy trên máy chủ prod.
#
# Workflow chỉ chạy khi biến repo DEPLOY_ENABLED = true
# (Settings > Secrets and variables > Actions > Variables).
# Trước khi có VPS thì để false, workflow bỏ qua chứ không đỏ.
#
# Cần các secret: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_PATH
# Token kéo image: GHCR_PULL_TOKEN nếu có, không thì GITHUB_TOKEN của job.
# Tùy chọn:       HEALTHCHECK_URL (cổng bắt buộc là localhost trên VPS)

on:
  push:
    branches: [main]
    paths:
      - "haido_core/**"
      - "haido_api/**"
      - "haido_pipeline/**"
      - "web/**"
      - "deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA để quay về (bỏ trống = commit hiện tại)"
        required: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image (${{ matrix.app }})
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: deploy/api.Dockerfile
          - app: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull and run on VPS
    if: vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Load SSH key and known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy compose file
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          scp deploy/compose.prod.yml "$USER@$HOST:$VPS_PATH/compose.prod.yml"

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        # Script nằm ở deploy/vps-deploy.sh. Biến đi trước dưới dạng gán, %q giữ nguyên ký tự lạ.
        # Token đi qua stdin, không nằm trên dòng lệnh của VPS.
        run: |
          {
            printf 'VPS_PATH=%q\nSHA=%q\nACTOR=%q\nPULL_TOKEN=%q\n' \
              "$VPS_PATH" "$SHA" "$ACTOR" "${GHCR_PULL_TOKEN:-$GITHUB_TOKEN}"
            cat deploy/vps-deploy.sh
          } | ssh -o BatchMode=yes "$USER@$HOST" bash -se

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "chưa đặt HEALTHCHECK_URL — bỏ qua"; exit 0
          fi
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$HEALTHCHECK_URL" > /dev/null; then
              echo "sống sau $i lần thử"; exit 0
            fi
            sleep 6
          done
          echo "không phản hồi sau 2 phút"; exit 1

      - name: Report rollback instructions on failure
        if: failure()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          echo "::warning::Deploy hỏng. Quay về bằng: chạy lại workflow này với input sha = commit trước đó."
          ssh -o BatchMode=yes "$USER@$HOST" "cd '$VPS_PATH' && docker compose -f compose.prod.yml ps" || true

      - name: Remove SSH key
        if: always()
        run: rm -rf ~/.ssh
