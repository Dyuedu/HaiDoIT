name: CI

# Cổng chặn merge. Mỗi job tự tắt khi phần mã nó canh chưa tồn tại,
# nên workflow xanh ngay từ Sprint 1 và tự bật khi mã xuất hiện.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect present code
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.look.outputs.python }}
      web: ${{ steps.look.outputs.web }}
      alembic: ${{ steps.look.outputs.alembic }}
    steps:
      - uses: actions/checkout@v7
      - id: look
        shell: bash
        run: |
          has() { [ -e "$1" ] && echo true || echo false; }
          {
            echo "python=$( [ -d haido_core ] || [ -f pyproject.toml ] && echo true || echo false )"
            echo "web=$(has web/package.json)"
            echo "alembic=$(has alembic.ini)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  gates:
    name: Architecture gates (AD-24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run gates
        # AD-1, AD-17, AD-25 bắt buộc: SKIP cũng tính là đỏ.
        run: python tools/gates/check_gates.py --require AD-1 AD-17 AD-25
      # Khi một tầng đã xong, thêm mã cổng vào --require để cấm nó quay lại BO QUA.
      # Ví dụ khi có REGISTRY.md (#3): --require AD-1 AD-17 AD-25 AD-2

  scraper:
    name: Scraper - observation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r scraper/requirements-vps.txt pytest
      - working-directory: scraper
        run: python -m pytest tests -q

  python:
    name: Python - ruff and pytest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv không có tag rút gọn từ v8 trở đi (chỉ có v4..v7), nên ghim tag đầy đủ.
      # Dependabot (.github/dependabot.yml) mở PR khi có bản mới.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        # --locked: uv.lock lệch với pyproject.toml thì đỏ, thay vì tự giải lại phụ thuộc.
        run: uv sync --locked --all-extras --dev
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest -q --junitxml=pytest.xml
      - name: Determinism tests run twice
        # Hai tiến trình riêng, mỗi lần một PYTHONHASHSEED khác nhau, để lộ kết quả phụ thuộc
        # thứ tự duyệt set/dict. Mã 5 nghĩa là chưa có test determinism nào: bỏ qua, không đỏ.
        # Mọi mã khác 0 còn lại là lỗi thật và làm job đỏ.
        run: |
          for seed in 0 1; do
            rc=0
            PYTHONHASHSEED=$seed uv run pytest -q -m determinism --junitxml="determinism-$seed.xml" || rc=$?
            if [ "$rc" -eq 5 ]; then echo "Chưa có test determinism, bỏ qua."; exit 0; fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results
          path: "*.xml"
          if-no-files-found: ignore

  alembic:
    name: Alembic single head (AD-25)
    needs: detect
    if: needs.detect.outputs.alembic == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: haido_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HAIDO_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/haido_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # xem chú thích ở job python
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - name: Exactly one head
        run: |
          heads=$(uv run alembic heads | grep -c "(head)")
          echo "số head: $heads"
          [ "$heads" -eq 1 ] || { uv run alembic heads; exit 1; }
      - name: Upgrade then downgrade on empty Postgres
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base

  web:
    name: Web - lint and build
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - name: Build - must pass here, prod never runs next build (AD-15)
        working-directory: web
        run: npm run build

  smoke:
    name: Smoke - local compose & web runtime
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start local compose
        run: docker compose -f deploy/compose.local.yml up -d --wait --build
      - name: Verify web runtime and proxy
        shell: bash
        run: |
          set -euo pipefail

          # 1. Đúng một thẻ <a> aria-current="page" trên / trỏ href="/"
          home_html=$(curl -s http://localhost:3000/)
          current_home_count=$(echo "$home_html" | grep -oE '<a [^>]*aria-current="page"[^>]*>' | wc -l)
          [ "$current_home_count" -eq 1 ]
          echo "$home_html" | grep -oE '<a [^>]*aria-current="page"[^>]*>' | grep -q 'href="/"'

          # 2. Đúng một thẻ <a> aria-current="page" trên /soi-tin trỏ href="/soi-tin"
          soitin_html=$(curl -s http://localhost:3000/soi-tin)
          current_soitin_count=$(echo "$soitin_html" | grep -oE '<a [^>]*aria-current="page"[^>]*>' | wc -l)
          [ "$current_soitin_count" -eq 1 ]
          echo "$soitin_html" | grep -oE '<a [^>]*aria-current="page"[^>]*>' | grep -q 'href="/soi-tin"'

          # 3. Bốn thẻ <a> trong nav
          nav_a_count=$(echo "$home_html" | grep -oE '<nav aria-label="Điều hướng chính"[^>]*>.*</nav>' | grep -o '<a ' | wc -l)
          [ "$nav_a_count" -eq 4 ]

          # 4. /api/v1/city-shares?role=data_ai có data và meta
          api_resp=$(curl -s http://localhost:3000/api/v1/city-shares?role=data_ai)
          echo "$api_resp" | grep -q '"data"'
          echo "$api_resp" | grep -q '"meta"'

          # 5. /api/..%2f..%2fopenapi.json trả 404
          status_traversal=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/api/..%2f..%2fopenapi.json")
          [ "$status_traversal" -eq 404 ]

          # 6. Dừng API -> 502 và code api_unavailable
          docker compose -f deploy/compose.local.yml stop api
          stopped_api_status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/api/v1/city-shares?role=data_ai")
          [ "$stopped_api_status" -eq 502 ]
          stopped_api_resp=$(curl -s "http://localhost:3000/api/v1/city-shares?role=data_ai")
          echo "$stopped_api_resp" | grep -q '"api_unavailable"'
      - name: Stop compose
        if: always()
        run: docker compose -f deploy/compose.local.yml down -v
