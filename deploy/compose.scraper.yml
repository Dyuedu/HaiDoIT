# Nhip mot tren VPS. Mot lan chay la mot lenh, khong co service thuong tru:
#   docker compose -f compose.scraper.yml run --rm scraper pipeline.py crawl --sources zalo,itnavi,careerlink,vietnamworks
#
# Dung `run --rm` chu khong `up` vi day la viec chay roi thoat, khong phai dich vu.

services:
  scraper:
    build:
      context: ../scraper
      dockerfile: Dockerfile
    image: haidoit-scraper:local
    env_file: [.env]
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - scraper_data:/app/data
    # 2 core / 3.8 GB: chan mot luot chay an het may
    deploy:
      resources:
        limits:
          memory: 1500M
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sau ingest của scraper: chép ngày đó vào schema haido rồi tính vòng đời. Không mở cổng.
  # Image do workflow deploy build từ deploy/warehouse.Dockerfile, cùng commit với API và web,
  # và vps-deploy.sh kéo về trước. daily.sh đặt HAIDO_WAREHOUSE_TAG từ .warehouse-tag (#273).
  # pull_policy never: cron không có token GHCR, và không bao giờ build kho trên VPS.
  # Thiếu tag thì mặc định `none`, chỉ lệnh chạy kho hỏng, scraper vẫn chạy.
  warehouse:
    image: ghcr.io/dyuedu/haidoit-warehouse:${HAIDO_WAREHOUSE_TAG:-none}
    pull_policy: never
    env_file: [.env]
    environment:
      TZ: Asia/Ho_Chi_Minh
      HAIDO_ALLOW_REMOTE_WRITE: "1"
      HAIDO_ALLOW_REMOTE_MIGRATION: "1"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # MoMo, TopDev, ITviec: can Chromium. Chromium hay vo voi /dev/shm mac dinh 64 MB.
  scraper-browser:
    build:
      context: ../scraper
      dockerfile: Dockerfile.browser
    image: haidoit-scraper-browser:local
    env_file: [.env]
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - scraper_data:/app/data
    shm_size: 512m
    deploy:
      resources:
        limits:
          memory: 1500M
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  scraper_data:
