# name tách khỏi project của compose.scraper.yml (project lấy theo tên thư mục trên VPS).
# `up --remove-orphans` chỉ dọn container của project này.
name: haido-prod

services:
  api:
    image: ghcr.io/dyuedu/haidoit-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      HAIDO_DATABASE_URL: ${HAIDO_DATABASE_URL:?}
      # Production đọc snapshot đã công bố (#162). Mặc định trong mã vẫn là `fake`; compose.local giữ `fake`
      # để job smoke của CI chạy trên DB rỗng.
      HAIDO_MARKET_SOURCE_CITY_SHARES: stat
      # Màn người mới đọc ô `entry` của snapshot đã công bố (#146).
      HAIDO_MARKET_SOURCE_NEWCOMER_ROLES: stat
      # Tỷ lệ kỹ năng theo vai trò và cấp đọc `stat_skill_rates` của snapshot đã công bố (#151); không còn số giả.
      HAIDO_MARKET_SOURCE_SKILL_RATES: stat
      # Màn kỹ năng theo vai trò đọc `stat_skill_rates` của snapshot đã công bố (#168); chưa có snapshot thì 404 `unknown_cell`, không số giả.
      HAIDO_MARKET_SOURCE_SKILL_ROLES: stat
      # Lộ trình (#309, #216): `stat` chỉ hiện lộ trình đã rà soát (#96), vai trò khác trả `not_ready`. Mọi khóa của SOURCE_ENV phải có ở đây
      # (tests/deploy/test_gh309_*), vì mã mặc định là `fake`.
      HAIDO_MARKET_SOURCE_LEARNING_PATH: stat
      # Cache response theo snapshot (#343): mỗi request vẫn hỏi bảng snapshots, nên snapshot mới lên ngay.
      HAIDO_RESPONSE_CACHE: "on"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/dyuedu/haidoit-web:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    networks:
      - default
      - edge
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: haido-edge
    external: true
