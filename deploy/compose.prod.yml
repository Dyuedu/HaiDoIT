# name tách khỏi project của compose.scraper.yml (project lấy theo tên thư mục trên VPS).
# `up --remove-orphans` chỉ dọn container của project này.
name: haido-prod

services:
  api:
    image: ghcr.io/dyuedu/haidoit-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      HAIDO_DATABASE_URL: ${HAIDO_DATABASE_URL:?}
      # Production đọc snapshot đã công bố (#162). Mặc định trong mã vẫn là `fake`; compose.local giữ `fake`
      # để job smoke của CI chạy trên DB rỗng.
      HAIDO_MARKET_SOURCE_CITY_SHARES: stat
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/dyuedu/haidoit-web:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    networks:
      - default
      - edge
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: haido-edge
    external: true
