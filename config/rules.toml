# Quy tắc có phiên bản của Hải Đồ IT (DoD dòng 4): ngưỡng, cửa sổ ngày, danh sách nguồn, bảng nhãn.
# Đổi giá trị nào ở đây thì tăng config_version; stat_job_lifecycle và stat_cells lưu phiên bản đã dùng.
config_version = "2026-11-13.1"

# Cửa sổ "tin còn mới": 0 <= snapshot - last_seen <= window_days (domain.lifecycle).
# Phép dân số đếm đúng window_days ngày kết thúc ở S, gồm cả S: S - (window_days - 1) <= last_seen <= S.
window_days = 60

# Ngưỡng mẫu: ô có n < min_sample thì tỷ trọng vẫn trả về nhưng đánh dấu mẫu nhỏ (AD-17).
min_sample = 30
# Ngưỡng nhóm kỹ năng (θ), dùng cho tỷ lệ kỹ năng.
theta_core = 0.3
theta_common = 0.1

# Tải CV lên (#140, AD-11): cỡ tối đa tính bằng byte (5 MiB) và kiểu file được nhận (PDF, DOCX).
# haido_api.uploads kiểm cả hai trước khi đọc thân request, rồi đối chiếu byte đầu của file.
cv_max_bytes = 5242880
cv_types = ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]

# Mã vai trò, theo thứ tự hiển thị. `all` (mọi vai trò) luôn có thêm và không nằm ở đây.
roles = [
    "embedded",
    "ai_ml",
    "data_engineer",
    "data_analyst",
    "qa",
    "devops",
    "mobile",
    "frontend",
    "backend",
    "other",
]

# Cấp bậc lọc được trên bản đồ (#163, DEC-8 #134), theo thứ tự hiển thị. `all` (mọi cấp) luôn có thêm và không nằm ở đây.
# Mỗi mã là một nhóm trong [level_groups] hoặc một mã của [labels.level]; `unknown` ("Level not stated") đứng riêng.
level_options = ["entry", "intern", "fresher", "junior", "mid", "senior", "lead", "unknown"]

# Mốc "tối đa N năm kinh nghiệm" lọc được trên bản đồ (#280), tăng dần. `any` (mọi số năm) luôn có thêm và không nằm ở đây.
# Mốc N đếm tin có số năm tối thiểu yêu cầu <= N; tin không ghi số năm chỉ nằm trong `any`.
years_options = [0, 1, 2, 3, 5]

# Nhóm cấp bậc: nhóm mới vào nghề của #134 là Intern, Fresher, Junior gộp một. `unknown` không thuộc nhóm nào.
[level_groups]
entry = ["intern", "fresher", "junior"]

[sources]
# Nguồn thu tự động hằng ngày (đúng AUTO_SOURCES của scraper/ingest.py).
# Nguồn ngoài danh sách này (topcv) chạy tay, lượt chạy ghi mode = "manual".
auto = ["zalo", "itnavi", "careerlink", "vietnamworks", "momo", "topdev", "itviec"]

# Hạng chọn tin đại diện của một cụm (#100). Tên đứng trước thắng khi hòa số trường và URL.
priority = ["itviec", "topdev", "vietnamworks", "careerlink", "itnavi", "topcv", "momo", "zalo"]

# Nguồn không bao giờ vào số công khai (#263). `aggregate` bỏ tin của nguồn này khỏi mọi ô và khỏi
# danh sách nguồn của snapshot. linkedin: tin cũ trong dữ liệu seed thu bằng tài khoản đã đăng nhập (PRD §6.1, R3).
excluded = ["linkedin"]

# Lưu ý độ phủ hiển thị trên mọi màn hình có số: ba lưu ý của FR-36 và lưu ý số nguồn.
# `{n}` trong n_sources là số nguồn có tin được đếm trong cửa sổ của snapshot.
[[coverage_notes]]
code = "n_sources"
text = "Dữ liệu chỉ gồm tin tuyển dụng IT đăng online trên {n} nguồn."

[[coverage_notes]]
code = "posting_not_demand"
text = "Tin tuyển dụng không đồng nghĩa với vị trí đang thực sự cần người."

[[coverage_notes]]
code = "big_city_bias"
text = "Dữ liệu nghiêng về thành phố lớn và công ty lớn."

[[coverage_notes]]
code = "salary_disclosed_only"
text = "Con số lương chỉ phản ánh những tin có công bố lương."

# Nhãn của bộ phân loại (domain/classify.py, tiếng Việt) sang mã snake_case.
# Nhãn không có trong bảng thì bước tổng hợp báo lỗi, không đoán mã. Thứ tự thành phố là thứ tự hiển thị.
# "không thuộc IT" không có trong bảng vai trò: tin đó không vào bảng tổng hợp.
[labels.city]
"Hà Nội" = "ha_noi"
"TP.HCM" = "ho_chi_minh"
"Đà Nẵng" = "da_nang"
"Khác" = "other"
"không xác định" = "unknown"

[labels.role]
"Embedded" = "embedded"
"AI/ML Engineer" = "ai_ml"
"Data Engineer" = "data_engineer"
"Data Analyst/BI" = "data_analyst"
"QA/Tester" = "qa"
"DevOps" = "devops"
"Mobile" = "mobile"
"Frontend" = "frontend"
"Backend" = "backend"
"Other" = "other"

[labels.level]
"Intern" = "intern"
"Fresher" = "fresher"
"Junior" = "junior"
"Mid" = "mid"
"Senior" = "senior"
"Lead" = "lead"
"không xác định" = "unknown"
