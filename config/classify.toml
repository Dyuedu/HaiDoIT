# Số năm từ mục yêu cầu khi bước trích để trống.
[years]
# Một số năm chỉ được nhận khi trong khoảng ngần này ký tự quanh nó có ngữ cảnh kinh nghiệm.
window_chars = 70
max_years = 15
context = "kinh nghiem|experience|\\bexp\\b|\\bkn\\b|nam lam|years? (?:as|in|of|working|hands-on)|nam (?:o|tai|trong) vi tri|toi thieu|it nhat|at least|minimum"
reject = "thanh lap|hop dong|bao hanh|tuoi|thang 13|nghi phep|ngay/nam|lich su|hoat dong|founded|established"
zero = "khong yeu cau kinh nghiem|khong can kinh nghiem|chua co kinh nghiem|chua can kinh nghiem|khong doi hoi kinh nghiem|chap nhan (?:ung vien |sinh vien )?chua co kinh nghiem|no experience required|no prior experience|no experience needed|kinh nghiem\\s*:?\\s*khong yeu cau|duoi 1 nam kinh nghiem|less than 1 year"

# Mục của JD. Dòng ngắn khớp `skip` thì ngừng giữ tới dòng ngắn khớp `keep`.
[sections]
max_heading_chars = 70
skip = "^[\\W\\d_]*(quyen loi|phuc loi|benefit|che do|thu nhap|muc luong|luong thuong|salary|moi truong lam viec|working environment|co hoi|career growth|dia diem|dia chi|thoi gian lam viec|ve chung toi|about us|about the company|gioi thieu cong ty|why you|why join|what we offer|we offer|perks|van hoa|culture|dan dau thi truong|cach thuc ung tuyen|ho so|how to apply)"
keep = "^[\\W\\d_]*(mo ta cong viec|yeu cau|uu tien|kinh nghiem|ky nang|responsibilit|requirement|qualification|experience|nhiem vu|trach nhiem|diem cong|bat buoc|hoc van|kien thuc|chuyen mon|must|nice to have|what you|job description|your role|cong viec|preferred|skills)"
# Che trước khi quét kỹ năng: "khoa học máy tính" bỏ dấu chứa "học máy".
