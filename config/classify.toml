# Luật phân loại tin (phép 6, #283): vai trò, chức danh con, cấp, số năm, mục của JD, bằng chứng kỹ năng.
# Đọc chức danh và văn bản JD trong bộ nhớ, không gọi mô hình. Đổi bất cứ giá trị nào ở đây thì đổi
# classify_version (ghi vào từng job_posting_facts) và config_version của config/rules.toml.
# Cụm so khớp trên chữ đã bỏ dấu (đ → d), chữ thường, theo biên chữ/số; cụm có khoảng trắng đầu/cuối
# được so nguyên văn (dùng cho chữ viết tắt ngắn).
classify_version = "classify-2026-11-13.2"

# Văn bản JD dài hơn thì chỉ đọc phần đầu.
max_text_chars = 50000

# Nguồn chỉ đăng tin IT: tin không có cụm vai trò và ít kỹ năng vẫn là Other, không phải không thuộc IT.
# Chức danh lãnh đạo hoặc kiến trúc IT: luôn là tin IT (Other), không cần bằng chứng kỹ năng.
generic_it_titles = ["cto", "giam doc cong nghe", "giam doc cntt", "solution architect", "solutions architect", "software architect", "technical architect", "engineering manager", "head of engineering"]

it_only_sources = ["itviec", "itnavi"]

# Danh mục của nguồn cho việc không thuộc IT: chỉ dùng khi chức danh không có cụm vai trò nào.
non_it_categories = ["finance", "hr", "human resources", "legal", "accounting", "sales"]

# Cụm chức danh của việc không thuộc IT. Thắng mọi vai trò trừ vai trò cụ thể khớp trước nó.
non_it_phrases = ["kinh doanh", "sales", "sale ", "ban hang", "telesale", "marketing", "ke toan", "accountant", "nhan su", "tuyen dung", "recruiter", "hanh chinh", "cham soc khach hang", "cskh", "customer service", "customer success", "account manager", "account executive", "business development", "phat trien kinh doanh", "giao vien", "giang vien", "tro giang", "teacher", "phien dich", "bien dich", "thu ky", "tro ly", "assistant", "co khi", "ky su dien", "dien cong nghiep", "xay dung", "noi that", "thiet ke do hoa", "graphic design", "video", "content", "copywriter", "seo", "tu van vien", "tu van ban", "kho van", "logistics", "mua hang", "purchasing", "tai chinh", "finance", "kiem toan", "audit", "luat", "legal", "phap che", "bat dong san", "bao hiem", "ngan hang", "telesales", "thu ngan", "le tan", "dieu duong", "duoc si", "bac si", "san xuat", "qc san pham", "cong nhan", "lai xe", "tai xe", "nhiep anh", "editor", "livestream", "tiktok", "media", "brand", "event", "su kien", "affiliate", "graphic", "motion designer", "vo tuyen", "procurement", "mua sam", "dien lanh", "o to", "kien truc su", "hoa chat", "cnc", "co dien", "vien thong", "tu van phan mem", "tu van giai phap phan mem", "user acquisition", "khach hang doanh nghiep", "khach hang ca nhan", "quan he khach hang"]
# Nghệ sĩ, đồ họa: không thuộc IT, trừ các cụm ở art_exceptions.
art_phrases = ["artist", "hoa si", "animator", "hoat hinh", "concept art", "video editor"]
art_exceptions = ["technical artist"]
# QA của phòng thử nghiệm phần cứng: chức danh có cụm này, không có chữ phần mềm và không có kỹ năng
# kiểm thử phần mềm thì không thuộc IT.
qa_hardware_phrases = ["qc", "quality control", "test engineer", "thu nghiem"]
qa_software_phrases = ["software", "phan mem", "api", "web", "app", "automation", "tester"]
qa_software_skills = ["test_design", "automation_testing", "manual_testing", "selenium", "playwright", "cypress", "appium", "postman", "api_testing", "jmeter", "regression", "istqb"]
qa_min_tech_skills = 3
# Manager trong các cụm này là tên vai trò, không phải cấp (trừ khi chức danh còn có lead/trưởng/head/giám đốc).
role_manager_phrases = ["product manager", "project manager", "account manager", "delivery manager", "program manager"]
role_manager_keep = ["lead", "truong", "head", "director", "giam doc"]
# Chữ cấp của nguồn không mang thông tin cấp.
ignore_source_levels = ["experienced (non-manager)", "tat ca cap bac"]
# Mã không tính là kỹ năng kỹ thuật khi đếm độ rộng và khi chấm điểm vai trò.
non_technical_skills = ["agile", "ai_tools", "chinese", "communication", "english", "erp", "excel", "japanese", "jira", "korean", "leadership", "ms_office", "negotiation", "photoshop", "problem_solving", "project_management", "self_learning", "software_testing", "teamwork", "time_management"]
# Thành phố (chưa đổi ở #283; #285 thay bằng 34 tỉnh).
