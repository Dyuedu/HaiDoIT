other_city_phrases = ["hải phòng", "hai phong", "cần thơ", "can tho", "huế", "hue", "biên hòa", "bien hoa"]

# Nhãn mới chưa có mã hiển thị (#284): lúc tổng hợp báo cáo như nhãn cũ. Kho vẫn lưu nhãn mịn.
[report_as]
"Data Scientist" = "AI/ML Engineer"
"Fullstack" = "Other"
"BA/PO/PM" = "Other"
"Security" = "Other"
"Hạ tầng/IT support" = "Other"
"UI/UX" = "Other"
"Game" = "Other"

# Ngưỡng bằng chứng kỹ năng.
[evidence]
# Chức danh không có cụm vai trò nào: cần ít nhất ngần này mã kỹ thuật khác nhau để là tin IT.
min_tech_skills_without_title = 4
# Chức danh chung (Other): ít hơn ngần này mã kỹ thuật thì không thuộc IT.
min_tech_skills_generic_title = 2
# Đủ ngần này mã kỹ thuật thì cụm Other/BA vẫn thắng cụm không thuộc IT trong chức danh.
min_tech_skills_override_non_it = 5
# Vai trò theo bằng chứng: điểm tối thiểu và tỷ lệ hơn vai trò thứ hai.
min_score = 4.0
win_ratio = 1.3
# Fullstack: cả Frontend và Backend đạt điểm này và bên yếu ít nhất bằng tỷ lệ này của bên mạnh.
fullstack_min_each = 6.0
fullstack_balance = 0.5
# Mỗi mã tính tối đa ngần này lượt khi chấm điểm.
max_mentions_per_skill = 3

# Vai trò theo thứ tự ưu tiên khi hai cụm khớp cùng vị trí. Cụm khớp sớm nhất trong chức danh thắng.
